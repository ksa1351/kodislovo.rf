<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уроки и задания — кодислово.рф</title>
<link rel="stylesheet" href="../assets/css/ui.css">
<style>
.page{max-width:1000px;margin:40px auto;padding:0 20px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 26px}
.filters select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lesson{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;color:var(--text);text-decoration:none;transition:.2s}
.lesson:hover{transform:translateY(-3px);border-color:#3a4aa0}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}.lesson h2{font-size:18px;margin:0 0 8px}.lesson p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.empty{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;color:var(--muted)}
.back{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.back a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<main class="page">
<h1>Уроки и задания</h1>
<p class="sub">Выберите класс или предмет. Здесь собраны опубликованные самостоятельные работы платформы «Код и слово».</p>
<div class="filters">
  <select id="classFilter"><option value="">Все классы</option></select>
  <select id="subjectFilter"><option value="">Все предметы</option></select>
  <select id="dateFilter"><option value="">Все даты</option></select>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty">По выбранным параметрам заданий пока нет.</div>
<div class="back"><a href="../">← На главную</a></div>
</main>
<script>
let allLessons=[];
const classFilter=document.getElementById('classFilter');
const subjectFilter=document.getElementById('subjectFilter');
const dateFilter=document.getElementById('dateFilter');
const grid=document.getElementById('grid');
const empty=document.getElementById('empty');

function fmtDate(s){const [y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.appendChild(o)}
function render(){
  const c=classFilter.value,s=subjectFilter.value,d=dateFilter.value;
  const items=allLessons.filter(x=>(!c||x.className===c)&&(!s||x.subjectLabel===s)&&(!d||x.date===d)&&x.status==='published');
  grid.innerHTML=items.map(x=>`
    <a class="lesson" href="${x.url}">
      <div class="meta">${x.className} · ${x.subjectLabel} · урок ${x.lessonNumber} · ${fmtDate(x.date)}</div>
      <h2>${x.title}</h2>
      <p>Код: ${x.code}</p>
    </a>`).join('');
  empty.style.display=items.length?'none':'block';
}
fetch('../data/lessons.json')
  .then(r=>r.json())
  .then(data=>{
    allLessons=data.lessons||[];
    [...new Set(allLessons.map(x=>x.className))].sort().forEach(x=>option(classFilter,x,x));
    [...new Set(allLessons.map(x=>x.subjectLabel))].sort().forEach(x=>option(subjectFilter,x,x));
    [...new Set(allLessons.map(x=>x.date))].sort().reverse().forEach(x=>option(dateFilter,x,fmtDate(x)));
    render();
  })
  .catch(()=>{empty.style.display='block';empty.textContent='Не удалось загрузить список заданий.'});
[classFilter,subjectFilter,dateFilter].forEach(el=>el.addEventListener('change',render));
</script>
</body>
</html>
